name: Zephyr build

on:
  workflow_dispatch:

jobs:
  build:
    name: Build Zephyr
    runs-on: macos-14
    timeout-minutes: 60
    steps:
      - name: Checkout upstream source (Amethyst-iOS-25, tag 2.1.3)
        uses: actions/checkout@v5
        with:
          repository: catsruledogs/Amethyst-iOS-25
          ref: 2.1.3
          submodules: recursive

      # old local build folders (if they were ever committed) make CMake reuse a stale cache
      - name: Remove stale build folders
        run: rm -rf Natives/build Natives/build_dbg Natives/build_ltw

